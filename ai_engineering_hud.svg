<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 300" width="440" height="300" role="img" aria-label="Joynal Abedin Full-Stack and AI RLHF Live Telemetry HUD">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070d19" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.75" />
      <stop offset="50%" stop-color="#0891b2" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0.75" />
    </linearGradient>
    <linearGradient id="barCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="barEmerald" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="barMix" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0891b2" />
      <stop offset="100%" stop-color="#2dd4bf" />
    </linearGradient>
    <linearGradient id="pipeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <style>
      .mono { font-family: 'Fira Code', 'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }

      @keyframes pulseDot {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.4; }
      }
      @keyframes pulseRing {
        0% { r: 4px; opacity: 0.75; }
        100% { r: 11px; opacity: 0; }
      }
      @keyframes blinkCursor {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      @keyframes slideFadeIn {
        from { opacity: 0; transform: translateX(-6px); }
        to { opacity: 1; transform: translateX(0); }
      }
      @keyframes fillBar1 {
        from { width: 0px; }
        to { width: 162px; }
      }
      @keyframes fillBar2 {
        from { width: 0px; }
        to { width: 168px; }
      }
      @keyframes fillBar3 {
        from { width: 0px; }
        to { width: 158px; }
      }
      @keyframes flowDash {
        to { stroke-dashoffset: -28; }
      }
      @keyframes nodeHighlight {
        0%, 100% { stroke-opacity: 0.45; }
        50% { stroke-opacity: 1; }
      }

      .live-dot { animation: pulseDot 1.8s ease-in-out infinite; }
      .live-ring { animation: pulseRing 1.8s ease-out infinite; }
      .cursor { animation: blinkCursor 1s step-end infinite; }

      .line-1 { opacity: 0; animation: slideFadeIn 0.45s ease-out 0.1s forwards; }
      .line-2 { opacity: 0; animation: slideFadeIn 0.45s ease-out 0.55s forwards; }
      .line-3 { opacity: 0; animation: slideFadeIn 0.45s ease-out 1.05s forwards; }
      .line-4 { opacity: 0; animation: slideFadeIn 0.45s ease-out 1.5s forwards; }

      .bar-1 { animation: fillBar1 1.4s cubic-bezier(0.22, 1, 0.36, 1) 0.3s both; }
      .bar-2 { animation: fillBar2 1.6s cubic-bezier(0.22, 1, 0.36, 1) 0.5s both; }
      .bar-3 { animation: fillBar3 1.8s cubic-bezier(0.22, 1, 0.36, 1) 0.7s both; }

      .signal-flow { stroke-dasharray: 6 8; animation: flowDash 1.1s linear infinite; }
      .node-1 { animation: nodeHighlight 2.4s ease-in-out 0s infinite; }
      .node-2 { animation: nodeHighlight 2.4s ease-in-out 0.6s infinite; }
      .node-3 { animation: nodeHighlight 2.4s ease-in-out 1.2s infinite; }
      .node-4 { animation: nodeHighlight 2.4s ease-in-out 1.8s infinite; }

      @media (prefers-reduced-motion: reduce) {
        .line-1, .line-2, .line-3, .line-4 { opacity: 1; animation: none; }
        .bar-1, .bar-2, .bar-3, .signal-flow, .live-dot, .live-ring, .cursor { animation: none; }
      }
    </style>
  </defs>

  <!-- Outer Card Frame -->
  <rect x="2" y="2" width="436" height="296" rx="14" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="1.5" />

  <!-- Section Divider Lines -->
  <line x1="2" y1="40" x2="438" y2="40" stroke="#1e293b" stroke-width="1" />
  <line x1="20" y1="148" x2="420" y2="148" stroke="#1e293b" stroke-width="1" stroke-dasharray="3 3" />
  <line x1="20" y1="238" x2="420" y2="238" stroke="#1e293b" stroke-width="1" stroke-dasharray="3 3" />

  <!-- Top Window Chrome -->
  <circle cx="22" cy="21" r="5" fill="#ef4444" opacity="0.85" />
  <circle cx="38" cy="21" r="5" fill="#f59e0b" opacity="0.85" />
  <circle cx="54" cy="21" r="5" fill="#10b981" opacity="0.85" />
  <text x="74" y="25" class="mono" font-size="11.5" fill="#94a3b8">joynal@engine:~/fullstack-x-rlhf</text>

  <!-- Pulsing LIVE Indicator -->
  <circle cx="366" cy="21" r="4" fill="#10b981" class="live-ring" />
  <circle cx="366" cy="21" r="4" fill="#10b981" class="live-dot" />
  <text x="377" y="25" class="mono" font-size="10.5" font-weight="700" fill="#10b981">ACTIVE</text>

  <!-- Animated CLI Execution Stream -->
  <g class="line-1">
    <text x="20" y="64" class="mono" font-size="11.5" fill="#38bdf8">$</text>
    <text x="34" y="64" class="mono" font-size="11.5" fill="#f1f5f9">ship --stack "TS · Next.js · Node · AWS"</text>
  </g>
  <g class="line-2">
    <text x="24" y="84" class="mono" font-size="11" fill="#10b981">✓</text>
    <text x="40" y="84" class="mono" font-size="11" fill="#94a3b8">APIs, DB schemas &amp; cloud CI/CD verified</text>
  </g>
  <g class="line-3">
    <text x="20" y="108" class="mono" font-size="11.5" fill="#38bdf8">$</text>
    <text x="34" y="108" class="mono" font-size="11.5" fill="#f1f5f9">align --llm "RLHF · SFT · DPO · Safety"</text>
  </g>
  <g class="line-4">
    <text x="24" y="128" class="mono" font-size="11" fill="#10b981">✓</text>
    <text x="40" y="128" class="mono" font-size="11" fill="#94a3b8">Rubrics calibrated · 3+ yrs @ Scale AI</text>
    <rect x="304" y="117" width="7" height="13" rx="1" fill="#10b981" class="cursor" />
  </g>

  <!-- Capability Telemetry Bars -->
  <text x="20" y="172" class="sans" font-size="11.5" font-weight="600" fill="#e2e8f0">Full-Stack &amp; Cloud</text>
  <rect x="148" y="163" width="175" height="8" rx="4" fill="#1e293b" />
  <rect x="148" y="163" width="162" height="8" rx="4" fill="url(#barCyan)" class="bar-1" />
  <text x="334" y="171" class="mono" font-size="10.5" fill="#38bdf8">MERN · AWS</text>

  <text x="20" y="197" class="sans" font-size="11.5" font-weight="600" fill="#e2e8f0">RLHF &amp; Post-Train</text>
  <rect x="148" y="188" width="175" height="8" rx="4" fill="#1e293b" />
  <rect x="148" y="188" width="168" height="8" rx="4" fill="url(#barEmerald)" class="bar-2" />
  <text x="334" y="196" class="mono" font-size="10.5" fill="#10b981">SFT · DPO</text>

  <text x="20" y="222" class="sans" font-size="11.5" font-weight="600" fill="#e2e8f0">LLM Safety &amp; Evals</text>
  <rect x="148" y="213" width="175" height="8" rx="4" fill="#1e293b" />
  <rect x="148" y="213" width="158" height="8" rx="4" fill="url(#barMix)" class="bar-3" />
  <text x="334" y="221" class="mono" font-size="10.5" fill="#2dd4bf">Red-Team</text>

  <!-- Bottom Live Signal Pipeline Nodes -->
  <line x1="62" y1="269" x2="382" y2="269" stroke="#1e293b" stroke-width="2" />
  <line x1="62" y1="269" x2="382" y2="269" stroke="url(#pipeGrad)" stroke-width="2.4" class="signal-flow" />

  <rect x="20" y="254" width="84" height="30" rx="6" fill="#0b1220" stroke="#2563eb" stroke-width="1.3" class="node-1" />
  <text x="62" y="273" text-anchor="middle" class="mono" font-size="10" font-weight="600" fill="#93c5fd">SPEC / CODE</text>

  <rect x="126" y="254" width="84" height="30" rx="6" fill="#0b1220" stroke="#0891b2" stroke-width="1.3" class="node-2" />
  <text x="168" y="273" text-anchor="middle" class="mono" font-size="10" font-weight="600" fill="#67e8f9">LLM EVAL</text>

  <rect x="232" y="254" width="84" height="30" rx="6" fill="#0b1220" stroke="#0d9488" stroke-width="1.3" class="node-3" />
  <text x="274" y="273" text-anchor="middle" class="mono" font-size="10" font-weight="600" fill="#5eead4">RLHF / DPO</text>

  <rect x="338" y="254" width="82" height="30" rx="6" fill="#0b1220" stroke="#10b981" stroke-width="1.3" class="node-4" />
  <text x="379" y="273" text-anchor="middle" class="mono" font-size="10" font-weight="600" fill="#6ee7b7">PROD AI</text>
</svg>